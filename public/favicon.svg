<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="hpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1035" />
      <stop offset="50%" stop-color="#0F0F1A" />
      <stop offset="100%" stop-color="#081E2E" />
    </linearGradient>
    <linearGradient id="hpBranchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="hpBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="hpNodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="1.5" y="1.5" width="45" height="45" rx="12" fill="url(#hpBgGrad)" stroke="url(#hpBorderGrad)" stroke-width="1.5"/>

  <!-- Tree Branches -->
  <path d="M24 13 L13 24" stroke="url(#hpBranchGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M24 13 L35 24" stroke="url(#hpBranchGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M13 24 L8 36" stroke="#9333EA" stroke-width="2" stroke-linecap="round"/>
  <path d="M13 24 L18 36" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <path d="M35 24 L30 36" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <path d="M35 24 L40 36" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>

  <!-- Crossbar Clamp Glyph -->
  <path d="M16 28 H32" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Nodes -->
  <circle cx="24" cy="13" r="4.5" fill="#7C3AED" stroke="#E9D5FF" stroke-width="1.5" filter="url(#hpNodeGlow)"/>
  <circle cx="24" cy="13" r="1.5" fill="#FFFFFF"/>

  <circle cx="13" cy="24" r="3.5" fill="#4F46E5" stroke="#C7D2FE" stroke-width="1.2"/>
  <circle cx="35" cy="24" r="3.5" fill="#0891B2" stroke="#A5F3FC" stroke-width="1.2"/>

  <circle cx="8" cy="36" r="2.5" fill="#C084FC"/>
  <circle cx="18" cy="36" r="2.5" fill="#67E8F9"/>
  <circle cx="30" cy="36" r="2.5" fill="#22D3EE"/>
  <circle cx="40" cy="36" r="2.5" fill="#34D399"/>
</svg>